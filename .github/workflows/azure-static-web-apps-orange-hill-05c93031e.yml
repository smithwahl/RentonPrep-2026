name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Create production environment file
        env:
          # NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          # NEXT_PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}
          # NEXT_PUBLIC_APPLY_URL: ${{ secrets.NEXT_PUBLIC_APPLY_URL }}
          CMS_MENUS_SOURCE: ${{ secrets.CMS_MENUS_SOURCE }}
          CMS_MENUS_API_URL: ${{ secrets.CMS_MENUS_API_URL }}
          CMS_MENUS_API_KEY: ${{ secrets.CMS_MENUS_API_KEY }}
          # CMS_PAGES_API_URL: ${{ secrets.CMS_PAGES_API_URL }}
          # CMS_PAGES_API_KEY: ${{ secrets.CMS_PAGES_API_KEY }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const keys = [
            'CMS_MENUS_SOURCE', 'CMS_MENUS_API_URL', 'CMS_MENUS_API_KEY',
          ];
          if (!process.env.CMS_MENUS_API_KEY) {
            throw new Error('CMS_MENUS_API_KEY must be set in GitHub Secrets');
          }
          const content = keys
            .filter((key) => process.env[key])
            .map((key) => `${key}=${JSON.stringify(process.env[key]).replace(/\$/g, '\\$')}`)
            .join('\n');
          fs.writeFileSync('.env.production', `${content}\n`, { mode: 0o600 });
          NODE
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ORANGE_HILL_05C93031E }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          api_location: "" # Api source code path - optional
          output_location: "" # Built app content directory - optional
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ORANGE_HILL_05C93031E }}
          action: "close"
